<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Central do CottonBrowser</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="hub-page">
  <main class="hub-shell">
    <h1>Central do navegador</h1>
    <p class="hub-intro">Gerencie páginas, favoritos e permissões em um só lugar.</p>
    <form id="open-tab-form">
      <h2>Abrir página</h2>
      <p>Comece uma nova aba com um endereço seguro.</p>
      <label for="open-url">Endereço HTTPS</label>
      <input id="open-url" name="url" type="url" inputmode="url" autocomplete="off" required placeholder="https://exemplo.com">
      <button type="submit">Abrir em nova aba</button>
    </form>
    <form id="bookmark-form">
      <h2>Salvar favorito</h2>
      <p>Guarde um endereço para encontrar depois.</p>
      <label for="bookmark-url">Endereço HTTPS</label>
      <input id="bookmark-url" name="url" type="url" inputmode="url" autocomplete="off" required placeholder="https://exemplo.com">
      <label for="bookmark-title">Nome do favorito</label>
      <input id="bookmark-title" name="title" type="text" maxlength="256" required placeholder="Ex.: Documentação">
      <button type="submit">Salvar favorito</button>
    </form>
    <section aria-labelledby="permissions-title">
      <h2 id="permissions-title">Permissões pendentes</h2>
      <p>Revise solicitações de acesso dos sites antes de decidir.</p>
      <div id="permissions" aria-live="polite"></div>
    </section>
    <output id="status" aria-live="polite"></output>
  </main>
  <script src="bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
