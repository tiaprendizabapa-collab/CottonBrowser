name: Publicar CottonBrowser

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar proteção do YouTube
        run: node CottonMobile/checks/youtube_protection_check.js
      - name: Verificar filtros embarcados e proteção da página
        run: |
          node CottonMobile/checks/build_filter_assets.js --check
          node CottonMobile/checks/page_protection_check.js
      - name: Verificar lista de bloqueio Android
        run: |
          mkdir -p "$RUNNER_TEMP/cotton-adblock-checks"
          javac -d "$RUNNER_TEMP/cotton-adblock-checks" \
            CottonMobile/app/src/main/java/com/cottonbrowser/mobile/DomainBlocklist.java \
            CottonMobile/app/src/main/java/com/cottonbrowser/mobile/RequestBlocklist.java \
            CottonMobile/checks/BlocklistChecks.java \
            CottonMobile/checks/RequestBlocklistChecks.java
          java -cp "$RUNNER_TEMP/cotton-adblock-checks" \
            com.cottonbrowser.mobile.BlocklistChecks \
            CottonMobile/app/src/main/assets/blocklist.txt \
            LeanBrowser/Assets/blocklist.txt
          java -cp "$RUNNER_TEMP/cotton-adblock-checks" \
            com.cottonbrowser.mobile.RequestBlocklistChecks CottonMobile/app/src/main/assets
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK Android
        run: gradle -p CottonMobile :app:assembleRelease --no-daemon
      - name: Habilitar emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verificar proteção no WebView Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p CottonMobile :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-protection-test-results
          path: |
            CottonMobile/app/build/reports/androidTests
            CottonMobile/app/build/outputs/androidTest-results
      - name: Verificar assinatura do APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose CottonMobile/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cottonbrowser-android-preview
          path: CottonMobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: mobile
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: cottonbrowser-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verificar fluxo de atualização
        shell: pwsh
        run: dotnet run --project BrowserUpdateChecks -c Release

      - name: Verificar downloads de mídia
        shell: pwsh
        run: dotnet run --project MediaDownloadChecks -c Release

      - name: Verificar sessão, abas, histórico e economia de memória
        shell: pwsh
        run: |
          foreach ($project in @('SessionChecks', 'TabNavigationChecks', 'UrlChecks', 'NavigationHistoryChecks', 'TabMemoryChecks')) {
            dotnet run --project $project
            if ($LASTEXITCODE -ne 0) { throw "Falha nas verificações: $project" }
          }

      - name: Definir versão e compilar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'branch') {
            if ($env:GITHUB_REF_NAME -ne 'main') { throw "Branch não suportada: $env:GITHUB_REF_NAME" }

            $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao consultar as versões publicadas.' }
            $tags = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao consultar as tags existentes.' }

            $versions = @([Version]'1.0.0')
            foreach ($release in $releases) {
              if ($release.draft -or $release.prerelease) { continue }
              if ($release.tag_name -match '^v(\d+\.\d+\.\d+)$') {
                $versions += [Version]$Matches[1]
              }
            }
            foreach ($tagRef in $tags) {
              if ($tagRef.ref -match '/v(\d+\.\d+\.\d+)$') {
                $versions += [Version]$Matches[1]
              }
            }

            $latest = $versions | Sort-Object | Select-Object -Last 1
            $version = '{0}.{1}.{2}' -f $latest.Major, $latest.Minor, ($latest.Build + 1)
            $project = [xml](Get-Content 'LeanBrowser/LeanBrowser.csproj' -Raw)
            $projectVersion = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            if ($projectVersion -match '^\d+\.\d+\.\d+$' -and [Version]$projectVersion -gt [Version]$version) {
              $version = $projectVersion
            }
            $tag = "v$version"
          }
          else {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag de versão inválida: $tag" }
            $version = $tag.Substring(1)
          }

          ./build-installer.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar e empacotar o CottonBrowser.' }

          dotnet run --project BrowserUpdateChecks -c Release -- --package CottonInstaller/dist/CottonBrowser-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'O pacote publicado não é aceito pelo atualizador do navegador.' }

          "COTTON_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "COTTON_RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: cottonbrowser-android-preview
          path: CottonInstaller/dist

      - name: Nomear APK Android
        shell: pwsh
        run: Move-Item -LiteralPath CottonInstaller/dist/app-release.apk -Destination CottonInstaller/dist/CottonBrowser-Android-preview.apk

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', $env:COTTON_RELEASE_TAG,
            'CottonInstaller/dist/CottonBrowser-win-x64.zip',
            'CottonInstaller/dist/CottonBrowserSetup.exe',
            'CottonInstaller/dist/CottonBrowser-Android-preview.apk',
            '--title', "CottonBrowser $env:COTTON_RELEASE_TAG"
          )

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += '--verify-tag'
            $arguments += '--generate-notes'
          }
          else {
            $arguments += @('--notes', "Atualização automática da branch main (versão $env:COTTON_RELEASE_VERSION).")
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a Release.' }
