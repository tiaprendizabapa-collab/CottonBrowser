name: Publicar CottonBrowser

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verificar fluxo de atualização
        shell: pwsh
        run: dotnet run --project BrowserUpdateChecks -c Release

      - name: Compilar e empacotar
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag de versão inválida: $tag" }
          ./build-installer.ps1 -Version ($tag.Substring(1))

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME CottonInstaller/dist/CottonBrowser-win-x64.zip CottonInstaller/dist/CottonBrowserSetup.exe --verify-tag --title "CottonBrowser $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a Release.' }
