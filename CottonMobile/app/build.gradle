plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cottonbrowser.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cottonbrowser.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            // Prévia instalável; uma chave de publicação estável requer secrets do repositório.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
